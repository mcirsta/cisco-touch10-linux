# Temporary direct-link fixture for ram110. Only the Touch 10 MAC can lease.
# Answers one local .test name; no upstream resolver or Internet forwarding.
port=53
no-hosts
no-resolv
interface=enp7s0
bind-dynamic
dhcp-authoritative
dhcp-host=set:touch10,24:16:9d:b6:77:bb,10.77.10.10,12h
dhcp-ignore=tag:!touch10
dhcp-range=10.77.10.10,10.77.10.10,255.255.255.0,12h
dhcp-option=option:router,10.77.10.1
dhcp-option=option:dns-server,10.77.10.1
local=/touch10-validation.test/
host-record=probe.touch10-validation.test,10.77.10.1
dhcp-leasefile=/run/touch10-dev-dhcp/leases
log-dhcp
