# Dedicated data cable on enp7s0. No DNS server or default route is advertised.
port=0
no-hosts
no-resolv
interface=enp7s0
bind-dynamic
dhcp-authoritative
dhcp-host=set:touch10,24:16:9d:b6:77:bb,10.77.10.10,12h
dhcp-ignore=tag:!touch10
dhcp-range=10.77.10.10,10.77.10.10,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/run/touch10-dev-dhcp/leases
log-dhcp
