# Perrier application playback: mono/stereo -> mono HFR, native 96 kHz S32.
pcm.perrier_hw {
    type hw
    card "Perrier"
    device 0
}

pcm.perrier_hfr {
    type route
    slave {
        pcm "perrier_hw"
        format S32_LE
        channels 4
    }
    # Average stereo; leave the other three native slots silent.
    ttable.0.3 0.5
    ttable.1.3 0.5
}

pcm.perrier {
    type plug
    slave {
        pcm "perrier_hfr"
        rate 96000
        format S32_LE
        channels 2
    }
    # Mono is duplicated before averaging, preserving its level.
    route_policy duplicate
    rate_converter "linear"
}

pcm.!default {
    type asym
    playback.pcm "perrier"
}

ctl.perrier {
    type hw
    card "Perrier"
}
ctl.!default {
    type hw
    card "Perrier"
}
