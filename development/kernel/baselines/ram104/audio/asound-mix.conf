# Perrier application playback with a shared, native-rate speaker PCM.
# The mixer owns the four-slot McPDM device. Application conversion and
# routing remain identical to the qualified ram99/100 configuration.
pcm.perrier_hw {
    type hw
    card "Perrier"
    device 0
}

pcm.perrier_mix {
    type dmix
    ipc_key 1346711378
    ipc_key_add_uid true
    ipc_perm 0600
    slave {
        pcm "perrier_hw"
        format S32_LE
        channels 4
        rate 96000
        period_size 960
        buffer_size 3840
    }
}

pcm.perrier_hfr {
    type route
    slave {
        pcm "perrier_mix"
        format S32_LE
        channels 4
    }
    # Average stereo into HFR slot 3; slots 0-2 stay silent.
    ttable.0.3 0.5
    ttable.1.3 0.5
}

pcm.perrier {
    type plug
    slave {
        pcm "perrier_hfr"
        rate 96000
        format S32_LE
        channels 2
    }
    route_policy duplicate
    rate_converter "linear"
}

pcm.!default {
    type asym
    playback.pcm "perrier"
}

ctl.perrier {
    type hw
    card "Perrier"
}
ctl.!default {
    type hw
    card "Perrier"
}
